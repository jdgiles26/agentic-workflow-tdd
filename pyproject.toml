[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-workflow-tdd"
version = "0.2.0"
description = "Local-first multi-agent TDD harness with red-before-green and unified local model backends"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "JD Giles" }]
keywords = ["ai", "agents", "tdd", "llm", "ollama", "llamacpp", "mlx", "langgraph"]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.1.0"]
langgraph = ["langgraph>=0.2.0", "langchain>=0.3.0"]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "black>=23.0.0", "ruff>=0.1.0", "mypy>=1.5.0"]

[project.scripts]
awt = "cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*", "memory*", "pipeline*", "agents*", "graphs*", "tools*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
